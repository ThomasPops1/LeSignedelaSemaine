<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les signes de la semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--muted:#D6D6D6;--card:#121212;--line:#333;--accent:#E2B43D;--accent-ink:#000;--chip:#E2B43D;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:20px 16px 32px 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{flex:none;display:block;width:90px;height:auto;margin:0}
h1{flex:1;margin:0;text-align:center;text-transform:uppercase;color:var(--accent);font-size:clamp(.75rem,4vw,1.35rem);line-height:1.2;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.player{width:min(100%,max(260px,calc(80vh*9/16)));margin:0 auto}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:9/16;width:100%;margin:0;border:3px solid var(--accent)}
video{width:100%;height:100%;object-fit:cover;display:block}
.hint{position:absolute;left:12px;bottom:40px;background:rgba(0,0,0,.65);color:#fff;font-size:.85rem;padding:6px 10px;border-radius:999px;pointer-events:none}
.seek{position:absolute;left:0;right:0;bottom:0;width:100%;height:30px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;touch-action:none}
.seek::-webkit-slider-runnable-track{height:6px;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.35) var(--p,0%))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--accent);border:2px solid #000}
.seek::-moz-range-track{height:6px;background:rgba(255,255,255,.35)}
.seek::-moz-range-progress{height:6px;background:var(--accent)}
.seek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #000}
.seek:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.playbig{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);width:72px;height:72px;min-height:0;padding:0;border-radius:50%;border:3px solid #000;background:var(--accent);display:grid;place-items:center;z-index:2;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.playbig svg{width:30px;height:30px;margin-left:4px;fill:#000}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{font:inherit;min-height:48px;border-radius:14px;border:1px solid var(--accent);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{margin-top:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.meaning{display:inline-block;margin-top:2px;background:var(--chip);color:#000;padding:4px 12px;border-radius:999px;font-weight:700;font-size:1.05rem}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:.95rem}
</style>
</head>

(function(){
var v=document.getElementById('v'),slow=document.getElementById('slow'),pause=document.getElementById('pause'),sound=document.getElementById('sound'),seek=document.getElementById('seek'),big=document.getElementById('play'),drag=false;
function play(){var p=v.play();if(p&&p.catch)p.catch(function(){})}
function toggle(){if(v.paused){play()}else{v.pause()}}
function refresh(){pause.textContent=v.paused?'Lecture':'Pause';big.style.display=v.paused?'grid':'none'}

v.addEventListener('click',toggle);big.addEventListener('click',play);pause.addEventListener('click',toggle);

v.addEventListener('timeupdate',function(){if(!drag)paint()});
v.addEventListener('loadedmetadata',paint);
seek.addEventListener('pointerdown',function(){drag=true});
seek.addEventListener('pointerup',function(){drag=false});
seek.addEventListener('input',function(){if(v.duration){v.currentTime=seek.value/1000*v.duration;seek.style.setProperty('--p',(seek.value/10)+'%')}});
